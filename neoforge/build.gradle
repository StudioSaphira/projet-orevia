plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                rootProject.java_version as int
        )
    }
}

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
        }

        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        orevia {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
}


dependencies {
    implementation("net.saphyra:saphyra-neoforge-${rootProject.minecraft_version}:${rootProject.saphyra_version}") {
        transitive = false
    }
}


// Package Orevia Common, but keep Saphyra as a separate required mod.
tasks.named('jar') {
    from(project(':common').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
