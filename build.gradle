plugins {
    id 'base'
}

group = 'net.orevia'
version = project.mod_version

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

tasks.register('buildJar', Jar) {

    archiveFileName =
            "${project.mod_id}-${project.mod_version}-${project.version_type}${project.version_id}-${project.minecraft_version}.jar"

    dependsOn(
            ':common:classes',
            ':common:processResources',
            ':fabric:classes',
            ':fabric:processResources',
            ':neoforge:classes',
            ':neoforge:processResources'
    )

    from(project(':common').sourceSets.main.output)
    from(project(':fabric').sourceSets.main.output)
    from(project(':neoforge').sourceSets.main.output)

    from(rootProject.projectDir) {
        include 'README.md'
        include 'CHANGELOG.md'
        include 'LICENSE.md'
        include 'NOTICE.md'
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    doLast {
        println ""
        println "========================================"
        println " OREVIA - JAR FINAL"
        println "========================================"
        println "Fichier : ${archiveFile.get().asFile.absolutePath}"
        println "Taille  : ${archiveFile.get().asFile.length()} octets"
        println "========================================"
    }
}

tasks.register('buildAll') {
    dependsOn 'buildJar'
}

subprojects {
    repositories {
        def saphyraRepository = providers.gradleProperty('saphyraRepository')
        if (saphyraRepository.isPresent()) {
            exclusiveContent {
                forRepository {
                    maven {
                        name = 'Saphyra'
                        url = uri(saphyraRepository.get())
                    }
                }
                filter { includeGroup 'net.saphyra' }
            }
        } else {
            exclusiveContent {
                forRepository { mavenLocal() }
                filter { includeGroup 'net.saphyra' }
            }
        }
    }
}

// A local file repository requires no hosting or credentials.
subprojects {
    apply plugin: 'maven-publish'
    publishing {
        repositories {
            maven {
                name = 'Development'
                url = rootProject.layout.buildDirectory.dir('repo')
            }
        }
    }
}

// Publish only the matching Saphyra variant; Common is already included in loader JARs.
subprojects {
    def saphyraArtifact = "saphyra-${project.name}-${rootProject.minecraft_version}".toString()
    def saphyraVersion = rootProject.saphyra_version.toString()
    afterEvaluate {
        publishing.publications.withType(MavenPublication).configureEach {
            pom.withXml {
                def dependency = asNode().appendNode('dependencies').appendNode('dependency')
                dependency.appendNode('groupId', 'net.saphyra')
                dependency.appendNode('artifactId', saphyraArtifact)
                dependency.appendNode('version', saphyraVersion)
                dependency.appendNode('scope', 'compile')
            }
        }
    }
}
